# Facilitator on Fly.io. Deploy with deploy/fly/deploy.sh.
app = 'agentpay-facilitator'
primary_region = 'sin'

[env]
  PORT = '8786'

[processes]
  app = 'node facilitator/dist/index.js'

[http_service]
  internal_port = 8786
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/supported'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
