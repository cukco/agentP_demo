# Verifier (+ Keeper) on Fly.io. Deploy with deploy/fly/deploy.sh.
# Run only ONE Verifier per DB/key: do not run a local Verifier against Fuji while this app is live.
app = 'agentpay-verifier'
primary_region = 'sin'

[env]
  PORT = '8787'
  VERIFIER_DB = '/data/verifier-b.db'
  VERIFIER_ALLOW_PRIVATE_SELLERS = 'false'
  # Chainlink eth_call from sin to the mainnet RPCs takes ~180-200 ms; 180 ms (default) times out.
  VERIFIER_ORACLE_RPC_TIMEOUT_MS = '400'
  KEEPER_STATE = '/tmp/keeper-state.json'

[processes]
  app = 'node verifier/dist/index.js'
  keeper = 'node keeper/dist/main.js'

[mounts]
  source = 'verifier_data'
  destination = '/data'
  processes = ['app']

[http_service]
  internal_port = 8787
  force_https = true
  # Background closing and expiry sweeps: keep the Verifier running.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  memory = '768mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['keeper']
