# Scorer on Fly.io. Deploy with deploy/fly/deploy.sh.
app = 'agentpay-scorer'
primary_region = 'sin'

[env]
  PORT = '8788'
  SCORER_DB = '/data/scorer.db'

[processes]
  app = 'node scorer/dist/index.js'

[mounts]
  source = 'scorer_data'
  destination = '/data'
  processes = ['app']

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
