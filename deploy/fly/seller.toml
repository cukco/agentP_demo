# Demo AVAX price seller (agent 306) on Fly.io. Deploy with deploy/fly/deploy-seller.sh.
# Its spec embeds VERIFIER_URL: changing that URL changes specHash (only new sessions are affected).
app = 'agentpay-seller'
primary_region = 'sin'

[env]
  VERIFIER_URL = 'https://agentpay-verifier.fly.dev/v1'
  # Fly terminates TLS; the only way in is the Fly proxy, so X-Forwarded-Proto can be trusted.
  TRUST_PROXY = 'true'

[processes]
  app = 'node seller/dist/index.js'

[http_service]
  internal_port = 4021
  force_https = true
  # The Seller SDK keeps voucher state in memory and closes from checkpoints after expiry.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
