name: CI

on:
  pull_request:
    branches: [build, agentpay]
  push:
    branches: [build, agentpay]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Foundry (build, test, freeze vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install forge-std v1.17.0 (not a submodule)
        run: git clone --depth 1 --branch v1.17.0 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv
      - name: Coverage gate (>= 95% lines on AgentPaySessionEscrow + BuyerRules)
        working-directory: contracts
        run: |
          forge coverage --ir-minimum --report summary | tee coverage.txt
          for f in src/AgentPaySessionEscrow.sol src/libraries/BuyerRules.sol; do
            pct=$(grep "| $f " coverage.txt | awk -F'|' '{print $3}' | grep -oE '[0-9]+\.[0-9]+' | head -1)
            echo "$f lines: $pct%"
            awk -v p="$pct" 'BEGIN { exit (p >= 95.0) ? 0 : 1 }' || { echo "coverage below 95% for $f"; exit 1; }
          done

  typescript:
    name: TypeScript (build, test)
    runs-on: ubuntu-24.04 # Playwright 1.56 has no Chromium build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Verifier uses node:sqlite (Node >= 22.13)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keeper / E2E tests run against anvil with artifacts from contracts/out
      - name: Install forge-std v1.17.0
        run: git clone --depth 1 --branch v1.17.0 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: forge build (artifacts for TS tests)
        working-directory: contracts
        run: forge build
      - run: pnpm --filter @agentpay/e2e exec playwright install --with-deps chromium
      - name: Build + test AgentPay packages
        # One package at a time: Verifier check tests enforce the real 500 ms per-check limit.
        run: pnpm turbo run test --concurrency=1 --filter='./packages/agentpay-*' --filter='./demo/*'
