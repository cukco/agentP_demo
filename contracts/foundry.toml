[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun" # Avalanche C-Chain: EIP-1153, PUSH0, MCOPY; no EIP-7702 (SystemDesign Q3)
optimizer = true
optimizer_runs = 1 # EIP-170: keeps AgentPaySessionEscrow under 24 KB
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
# TS <-> Solidity shared vectors (packages/agentpay-core/vectors)
fs_permissions = [
  { access = "read", path = "../packages/agentpay-core/vectors" },
  { access = "read-write", path = "../deployments" },
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 10000

[rpc_endpoints]
fuji = "${FUJI_RPC_URL_1}"
avalanche = "${AVAX_MAINNET_RPC_URL_1}"
