<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPay approval</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #172d2b; background: #f6f7f2; line-height: 1.5; }
  body { margin: 0; }
  main { max-width: 780px; margin: 0 auto; padding: clamp(24px, 6vw, 64px) 20px; }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.04em; line-height: 1.05; margin: 0 0 18px; }
  p { max-width: 66ch; }
  dl { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr; margin: 24px 0; column-gap: 16px; }
  dt, dd { padding: 7px 0; border-bottom: 1px solid #ccd7cc; }
  dt { color: #4a625c; } dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  details { margin: 16px 0; } pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  button { font: inherit; padding: 10px 16px; margin: 4px 8px 4px 0; border: 1px solid #146a51; border-radius: 6px; cursor: pointer; }
  #approve { background: #146a51; color: white; }
  #deny { background: transparent; color: #146a51; } button:disabled { opacity: .5; cursor: default; }
  [role=status] { min-height: 1.5em; }
</style></head>
<body><main>
<h1>AgentPay approval</h1>
<p>Check the terms here before confirming the signature in MetaMask.</p>
<dl></dl><details hidden><summary>Verification spec</summary><pre></pre></details>
<button id="approve" disabled>Approve in MetaMask</button><button id="deny" disabled>Decline</button>
<p role="status" aria-live="polite"></p>
</main><!-- APPROVAL_SCRIPT --></body></html>
